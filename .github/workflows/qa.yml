name: AutoRoadMarking Static QA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate source manifest
        run: python tools/update-manifest.py

      - name: Run static QA
        run: python tools/qa-static.py

      - name: Commit refreshed manifest
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- SOURCE_MANIFEST.sha256; then
            echo "Manifest already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE_MANIFEST.sha256
          git commit -m "chore: refresh source manifest [skip ci]"
          git push
